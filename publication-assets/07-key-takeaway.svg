<text x="120" y="120" font-size="30" fill="#4CC2FF" font-weight="750" text-anchor="start" class="">KEY TAKEAWAY</text>
<text x="120" y="275" font-size="78" fill="#F6F8FB" font-weight="800" text-anchor="start" class="">10 outcomes changed</text>
<text x="120" y="373" font-size="78" fill="#F6F8FB" font-weight="800" text-anchor="start" class="">the candidate snapshot.</text>
